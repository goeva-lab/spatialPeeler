[project]
name = "spatialpeeler"
version = "0.1.0"
dependencies = [
    "plotnine",
    "numpy",
    "pandas",
    "scanpy",
    "scipy",
    "scikit-learn",
    "statsmodels",
]
[project.optional-dependencies]
dev = ["jupytext", "ipykernel", "nbconvert"]

[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"
