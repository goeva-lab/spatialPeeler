[project]
name = "spatialpeeler"
version = "0.1.0"
dependencies = [
    "scanpy",
    "plotnine",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "jax",
    "uapl@git+ssh://git@github.com/goeva-lab/uapl.git",
]
[project.optional-dependencies]
dev = [
    "jupytext",
    "ipykernel",
    "nbconvert",
    "ipywidgets",
    "adjustText",
    "pybiomart",
    "upsetplot",
]

[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"
